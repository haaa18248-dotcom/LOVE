
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ម៉ាស៊ីនគិតលេខ ❤️</title>

  <style>
    /* SAME CSS AS YOUR ORIGINAL */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 400px;
      width: 100%;
    }

    .calculator {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }

    .display {
      background: #0f172a;
      width: 100%;
      height: 70px;
      border-radius: 12px;
      padding: 15px;
      text-align: right;
      font-size: 2rem;
      color: #38bdf8;
      border: 1px solid #334155;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #334155;
      color: #fff;
      font-weight: bold;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #0284c7;
    }

    .operator:hover {
      background: #0369a1;
    }

    .clear {
      background: #ef4444;
    }

    .clear:hover {
      background: #dc2626;
    }

    .equal {
      background: #10b981;
      grid-column: span 2;
    }

    .equal:hover {
      background: #059669;
    }

    /* I LOVE YOU MESSAGE */

    .love-message {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .love-message.active {
      display: flex;
    }

    .love-box {
      background: #1e293b;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .love-box h1 {
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .love-box button {
      background: #10b981;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="calculator">

      <input
        type="text"
        class="display"
        id="display"
        readonly
        value="0"
      >

      <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>

        <button onclick="appendValue('/')" class="operator">
          ÷
        </button>

        <button onclick="appendValue('*')" class="operator">
          ×
        </button>

        <button onclick="appendValue('-')" class="operator">
          -
        </button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>

        <button onclick="appendValue('+')" class="operator">
          +
        </button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>

        <button onclick="appendValue('.')">.</button>

        <!-- = BUTTON -->
        <button class="equal" onclick="showLove()">=</button>          =
        </button>

      </div>
    </div>

  </div>


  <!-- I LOVE YOU POPUP -->

  <div class="love-message" id="loveMessage">

    <div class="love-box">

      <h1>I LOVE YOU ❤️</h1>

      <p>😂 You thought this was a calculator!</p>

      <button onclick="closeLove()">
        OK
      </button>

    </div>

  </div>


  <script>

    const display = document.getElementById("display");
    const loveMessage = document.getElementById("loveMessage");

    function appendValue(value) {

      if (display.value === "0") {
        display.value = value;
      } else {
        display.value += value;
      }

    }

    function clearDisplay() {
      display.value = "0";
    }

    // ចុច = → I LOVE YOU ❤️
function showLove() {
  display.value = "I LOVE YOU ❤️";
}

    function closeLove() {

      loveMessage.classList.remove("active");

    }

  </script>

</body>
</html>
